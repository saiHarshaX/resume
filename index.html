<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Showcase PDF</title>
    <style>
      :root {
        color-scheme: dark;
        --canvas: #09090b;
        --surface: #18181b;
        --surface-elevated: #111113;
        --text: #fafafa;
        --muted: #a1a1aa;
        --border: #27272a;
        --button: #fafafa;
        --button-hover: #e4e4e7;
        --button-text: #18181b;
        --header-height: 4.5rem;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        min-height: 100dvh;
        margin: 0;
        background: var(--canvas);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .site-header {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 1rem;
        min-height: var(--header-height);
        padding: 0.75rem clamp(1rem, 3vw, 2rem);
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }

      .download-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        width: 2.75rem;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 0.375rem;
        background: var(--button);
        color: var(--button-text);
        text-decoration: none;
        transition: background-color 150ms ease, transform 150ms ease;
        touch-action: manipulation;
      }

      .download-button:hover {
        background: var(--button-hover);
      }

      .download-button:active {
        transform: scale(0.98);
      }

      .download-button:focus-visible {
        outline: 3px solid #60a5fa;
        outline-offset: 2px;
      }

      .download-icon {
        width: 1.125rem;
        height: 1.125rem;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
      }

      .viewer-shell {
        display: flex;
        min-height: 0;
        padding: clamp(0.75rem, 2vw, 1.5rem);
      }

      .pdf-viewer {
        width: 100%;
        min-height: 20rem;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        background: var(--surface-elevated);
      }

      .pdf-viewer object {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 20rem;
        border: 0;
      }

      .pdf-fallback {
        display: grid;
        min-height: 20rem;
        place-content: center;
        gap: 0.5rem;
        padding: 1.5rem;
        color: var(--muted);
        text-align: center;
      }

      .pdf-fallback a {
        color: var(--text);
        font-weight: 600;
      }

      @media (max-width: 40rem) {
        .site-header {
          min-height: 4rem;
        }

      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a
        class="download-button"
        href="HarshaVardhanFD.pdf"
        download="HarshaVardhanFD.pdf"
        aria-label="Download HarshaVardhanFD.pdf"
        title="Download HarshaVardhanFD.pdf"
      >
        <svg class="download-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v12" />
          <path d="m7 10 5 5 5-5" />
          <path d="M5 21h14" />
        </svg>
      </a>
    </header>

    <main class="viewer-shell">
      <section class="pdf-viewer" aria-label="PDF viewer">
        <object data="HarshaVardhanFD.pdf#pagemode=none&zoom=page-width" type="application/pdf" aria-label="HarshaVardhanFD PDF">
          <div class="pdf-fallback">
            <span>PDF preview is unavailable in this browser.</span>
            <a href="HarshaVardhanFD.pdf" download="HarshaVardhanFD.pdf">Download HarshaVardhanFD.pdf</a>
          </div>
        </object>
      </section>
    </main>
  </body>
</html>
